name: mirror

# Copies the images and charts in manifest.json to ghcr.io/<owner>/<repo>,
# keeping each tag name. A tag that GHCR already has at the same digest is
# left alone.
#   image entry (repo:tag): every tag of the repo with that tag's digest.
#   chart entry (repo):     every tag of the repo.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install regctl
        run: |
          curl -fsSL -o regctl https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  regctl" | sha256sum -c
          sudo install -m 755 regctl /usr/local/bin/regctl
          rm regctl
      - name: Log in to dhi.io and ghcr.io
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker login dhi.io --username "$DHI_USERNAME" --password-stdin <<<"$DHI_TOKEN"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GHCR_TOKEN"
      - name: Mirror
        run: |
          set -euo pipefail
          errors=$(mktemp)

          # digest_unless <ref> <pattern>: prints the digest of <ref>, or
          # nothing when the lookup fails with an error matching <pattern>.
          # Any other error stops the run.
          digest_unless() {
            if regctl manifest head "$1" 2>"$errors"; then
              return
            fi
            if ! grep -qE "$2" "$errors"; then
              cat "$errors" >&2
              return 1
            fi
          }

          # push <source repo> <tag> <digest>: copies the source digest with
          # its signatures and attestations to the same tag on GHCR.
          # --digest-tags also brings legacy sha256-<digest>.sig signatures.
          push() {
            local dest current
            dest="ghcr.io/$GITHUB_REPOSITORY/${1##*/}:$2"
            current=$(digest_unless "$dest" '\[http 404\]')
            if [[ $current == "$3" ]]; then
              return
            fi
            echo "$dest: ${current:-new} -> $3"
            regctl image copy --referrers --digest-tags "$1@$3" "$dest"
          }

          # Each $(...) is assigned on its own line, so a failed lookup stops
          # the run instead of being read as an empty value.
          images=$(jq -r '.images[]' manifest.json)
          for entry in $images; do
            repo=${entry%:*}
            entry_tag=${entry##*:}
            digest=$(regctl manifest head "$entry")
            echo "$entry is $digest"
            # The entry tag is pushed at the digest just read, even if it
            # moves during the scan below.
            push "$repo" "$entry_tag" "$digest"
            tags=$(regctl tag ls "$repo")
            for tag in $tags; do
              if [[ $tag == "$entry_tag" ]]; then
                continue
              fi
              # dhi.io lists FIPS tags but refuses them without an entitlement;
              # such a tag never shares a tracked tag's digest.
              tag_digest=$(digest_unless "$repo:$tag" 'No entitlement for')
              if [[ $tag_digest == "$digest" ]]; then
                push "$repo" "$tag" "$digest"
              fi
            done
          done

          charts=$(jq -r '.charts[]' manifest.json)
          for repo in $charts; do
            echo "$repo: every chart tag"
            tags=$(regctl tag ls "$repo")
            for tag in $tags; do
              # Signature tags (sha256-...) are not charts. Copying a chart
              # with --referrers brings its current signatures along.
              if [[ $tag == sha256-* ]]; then
                continue
              fi
              digest=$(regctl manifest head "$repo:$tag")
              push "$repo" "$tag" "$digest"
            done
          done
